# Render Blueprint: deploys dist/ as a static site.
services:
  - type: web
    name: jewel-portfolio
    runtime: static
    buildCommand: node verify.mjs
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
